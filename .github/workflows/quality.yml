name: quality

on:
  push:
  pull_request:

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --editable .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q rocm_evidence_matrix
      - name: Validate committed evidence and generated views
        run: rocm-matrix check

  windows-offline-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --editable .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q rocm_evidence_matrix
      - name: Validate committed evidence and generated views
        run: rocm-matrix check

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and development tools
        run: python -m pip install --editable ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        continue-on-error: true
        run: ruff format --check .
      - name: Pyright type check
        continue-on-error: true
        run: pyright
      - name: Dependency audit
        continue-on-error: true
        run: deptry .
      - name: Dead-code audit
        continue-on-error: true
        run: vulture rocm_evidence_matrix tests --min-confidence 100
