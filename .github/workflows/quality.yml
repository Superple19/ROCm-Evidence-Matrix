name: quality

on:
  push:
  pull_request:

jobs:
  linux-offline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.12"
      - name: Install project
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Compile sources
        run: uv run --locked python -m compileall -q rocm_evidence_matrix
      - name: Validate committed evidence and generated views
        run: uv run --locked rocm-matrix check

  windows-offline-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.12"
      - name: Install project
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Compile sources
        run: uv run --locked python -m compileall -q rocm_evidence_matrix
      - name: Validate committed evidence and generated views
        run: uv run --locked rocm-matrix check

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.12"
      - name: Install project and development tools
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format check
        continue-on-error: true
        run: uv run --locked ruff format --check .
      - name: Pyright type check
        run: uv run --locked pyright
      - name: Dependency audit
        continue-on-error: true
        run: uv run --locked deptry .
      - name: Dead-code audit
        continue-on-error: true
        run: uv run --locked vulture rocm_evidence_matrix tests --min-confidence 100

  catalog-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          python-version: "3.12"
      - name: Install project
        run: uv sync --locked
      - name: Validate source artifacts
        run: uv run --locked rocm-matrix check
      - name: Build and verify catalog bundle
        id: bundle
        shell: bash
        run: |
          bundle_version="$(date -u +%Y.%m.%d)"
          output="dist/rocm-matrix-catalog-${bundle_version}.zip"
          uv run --locked rocm-matrix bundle \
            --output "$output" \
            --bundle-version "$bundle_version" \
            --matrix-commit "$GITHUB_SHA"
          uv run --locked rocm-matrix verify-bundle "$output"
          echo "output=$output" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rocm-matrix-catalog-${{ github.sha }}
          path: ${{ steps.bundle.outputs.output }}
