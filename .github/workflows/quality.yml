name: quality

on:
  push:
  pull_request:

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --editable .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed evidence and generated views
        run: rocm-matrix check

  windows-offline-quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --editable .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate committed evidence and generated views
        run: rocm-matrix check
