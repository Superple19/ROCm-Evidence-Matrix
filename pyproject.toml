[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rocm-evidence-matrix"
version = "0.1.0"
description = "Evidence-based ROCm platform compatibility data and documentation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
  {name = "Superple19"}
]
dependencies = [
  "packaging>=24",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
  "deptry>=0.23",
  "prek>=0.5.2,<0.6",
  "pyright>=1.1.390",
  "ruff>=0.16",
  "vulture>=2.14",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", ".cache", "data", "snapshots", "docs/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["rocm_evidence_matrix"]
exclude = ["tests", "data", "docs/generated", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
reportUnknownMemberType = "none"

[tool.deptry]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
DEP001 = ["torch"]

[tool.uv]
required-version = ">=0.12.10,<0.13"

[project.urls]
Repository = "https://github.com/Superple19/rocm-evidence-matrix"

[project.scripts]
rocm-matrix = "rocm_evidence_matrix.collect:main"

[tool.setuptools.packages.find]
include = ["rocm_evidence_matrix*"]
